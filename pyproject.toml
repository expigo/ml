[project]
name = "ml-data-science-library"
version = "1.0.0"
description = "Comprehensive Data Science and Machine Learning library with theory, examples, and interview preparation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Core Data Science Libraries
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",

    # Machine Learning
    "scikit-learn>=1.3.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",

    # Statistical Analysis
    "statsmodels>=0.14.0",

    # Jupyter
    "jupyter>=1.0.0",
    "ipykernel>=6.22.0",
    "ipywidgets>=8.0.0",

    # Advanced ML Libraries
    "xgboost>=1.7.0",
    "lightgbm>=3.3.5",

    # Dimensionality Reduction
    "umap-learn>=0.5.3",

    # Imbalanced Learning
    "imbalanced-learn>=0.11.0",

    # Utilities
    "tqdm>=4.65.0",
    "joblib>=1.2.0",

    # For hypothesis testing and multiple testing
    "pingouin>=0.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"
